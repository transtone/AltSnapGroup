name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare executable
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/AltSnapGroup.exe AltSnapGroup-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltSnapGroup-windows-x64
          path: AltSnapGroup-windows-x64.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AltSnapGroup-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: AltSnapGroup-windows-x64.exe
          fail_on_unmatched_files: true
          generate_release_notes: true